events {
    worker_connections 1024;
}

http {
    upstream rust_ticket_service_backend {
        # Load balancing across 3 Rust ticket service replicas
        server ticket-service-rust-1:8080 max_fails=3 fail_timeout=30s;
        server ticket-service-rust-2:8080 max_fails=3 fail_timeout=30s;
        server ticket-service-rust-3:8080 max_fails=3 fail_timeout=30s;
        
        # Use least_conn for better distribution of long-running requests
        least_conn;
    }

    # Health check configuration
    upstream rust_ticket_service_health {
        server ticket-service-rust-1:8080;
        server ticket-service-rust-2:8080;
        server ticket-service-rust-3:8080;
    }

    # Logging configuration with additional Rust-specific info
    log_format rust_main '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" "$http_x_forwarded_for" '
                         'upstream_addr=$upstream_addr '
                         'upstream_response_time=$upstream_response_time '
                         'request_time=$request_time '
                         'rust_service=$upstream_addr';

    access_log /var/log/nginx/access.log rust_main;
    error_log /var/log/nginx/error.log warn;

    # Proxy settings optimized for Rust services
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain application/json application/xml text/css text/js text/xml application/javascript;

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Load balancer status
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Docker networks
            deny all;
        }

        # Main application routes with Rust-specific headers
        location / {
            proxy_pass http://rust_ticket_service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Add custom headers for debugging Rust services
            add_header X-Upstream-Server $upstream_addr always;
            add_header X-Response-Time $upstream_response_time always;
            add_header X-Service-Type "rust-distributed" always;
            
            # Health check for upstream with Rust-specific timeouts
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        # Events API - optimized for event creation
        location /events {
            proxy_pass http://rust_ticket_service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Route "events" always;
            add_header X-Service-Type "rust-distributed" always;
            
            # Longer timeout for event creation
            proxy_read_timeout 30s;
        }

        # Reservations API - optimized for distributed queries
        location /reservations {
            proxy_pass http://rust_ticket_service_backend;
            proxy_set_header Host $host;
            proxy_Set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Route "reservations" always;
            add_header X-Service-Type "rust-distributed" always;
            
            # Extended timeout for distributed queries and real-time updates
            proxy_read_timeout 15s;
        }

        # Enhanced reservations with custom timeout
        location ~ ^/reservations/([^/]+)/timeout/(\d+)$ {
            proxy_pass http://rust_ticket_service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Route "reservations-timeout" always;
            add_header X-Service-Type "rust-distributed" always;
            
            # Dynamic timeout based on URL parameter (max 60s)
            proxy_read_timeout 60s;
        }

        # Metrics endpoint for monitoring
        location /metrics {
            proxy_pass http://rust_ticket_service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Route "metrics" always;
            
            # Quick response for metrics
            proxy_read_timeout 5s;
        }

        # Health check proxy to all instances
        location /v1/health_check {
            proxy_pass http://rust_ticket_service_health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Service-Type "rust-distributed" always;
        }

        # Area status endpoint - optimized for quick lookups
        location ~ ^/events/([^/]+)/areas/([^/]+)/status$ {
            proxy_pass http://rust_ticket_service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Route "area-status" always;
            add_header X-Service-Type "rust-distributed" always;
            
            # Quick timeout for area status
            proxy_read_timeout 5s;
        }
    }
}